name: Build Vivo Y04 CSI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VivoY04_CSI_Final.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name 'VivoY04_CSI_Final.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "VivoY04_CSI_Final.zip not found in repository."
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -type f -name 'settings.gradle.kts' -print -quit | xargs -r dirname)
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -type f -name 'settings.gradle' -print -quit | xargs -r dirname)
          fi
          if [ -z "$PROJECT" ]; then
            echo "Android Gradle project not found after extraction."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VivoY04-CSI-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
